services:
  api:
    build: .
    image: shortlink:local
    init: true
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped